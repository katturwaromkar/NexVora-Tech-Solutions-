<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Glass Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Futuristic Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.35"/>

  <!-- Yugvex Stylized "Y" Monogram -->
  <g filter="url(#glow)">
    <path d="M 130 110 L 220 250 C 235 273 250 290 256 300 C 262 290 277 273 292 250 L 382 110 C 392 95 412 90 427 100 C 442 110 447 130 437 145 L 305 350 L 305 410 C 305 428 290 442 272 442 L 240 442 C 222 442 207 428 207 410 L 207 350 L 75 145 C 65 130 70 110 85 100 C 100 90 120 95 130 110 Z" fill="url(#brandGrad)"/>
  </g>

  <!-- Pulse Glow Node at Top Right -->
  <circle cx="410" cy="110" r="22" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="410" cy="110" r="9" fill="#ffffff"/>
</svg>
