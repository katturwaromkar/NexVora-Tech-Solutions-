<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" width="550" height="350">
  <defs>
    <linearGradient id="yNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="50%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="yBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1b36"/>
    </linearGradient>
    <linearGradient id="vBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0044ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#00d5ff"/>
    </linearGradient>
    <linearGradient id="vHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a3ff" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#00c3ff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#00d5ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
  </defs>

  <g transform="translate(25, 20)">
    <!-- Y Dark Navy 3D Structure -->
    <path d="M 60 25 L 195 185 L 195 255 L 125 255 L 125 185 L 10 25 Z" fill="url(#yBevelGrad)" />
    <path d="M 60 25 L 260 25 L 290 75 L 195 210 L 195 275 L 125 275 L 125 185 L 185 85 L 105 25 Z" fill="url(#yNavyGrad)" />

    <!-- V Electric Blue Structure -->
    <path d="M 160 200 L 255 275 L 305 275 L 210 200 Z" fill="#0033aa" />
    <path d="M 210 200 L 285 275 L 435 65 L 365 65 L 260 220 L 220 155 Z" fill="url(#vBlueGrad)" />
    <path d="M 260 220 L 365 65 L 395 65 L 285 240 Z" fill="url(#vHighlightGrad)" opacity="0.8" />

    <!-- SWOOSH ARC -->
    <path d="M 45 205 C 75 275, 185 260, 275 235 C 375 205, 435 110, 465 70 C 395 160, 285 210, 185 220 C 115 227, 65 205, 45 205 Z" fill="url(#swooshGrad)" />
    <path d="M 50 195 C 115 270, 255 235, 450 70 C 345 180, 205 225, 50 195 Z" fill="#ffffff" opacity="0.85" />

    <!-- DIGITAL PIXEL GRID -->
    <rect x="425" y="35" width="14" height="14" rx="2.5" fill="#00c8ff" />
    <rect x="444" y="35" width="14" height="14" rx="2.5" fill="#0077ff" />
    <rect x="463" y="35" width="10" height="10" rx="2" fill="#38bdf8" />
    
    <rect x="410" y="54" width="16" height="16" rx="3" fill="#0055ff" />
    <rect x="431" y="54" width="16" height="16" rx="3" fill="#00d5ff" />
    <rect x="452" y="54" width="20" height="20" rx="3.5" fill="#0033cc" />
    <rect x="477" y="54" width="12" height="12" rx="2" fill="#00a3ff" />
    
    <rect x="438" y="75" width="14" height="14" rx="2.5" fill="#00b4ff" />
    <rect x="457" y="78" width="12" height="12" rx="2" fill="#38bdf8" />
    <rect x="474" y="78" width="10" height="10" rx="2" fill="#0055ff" />
    
    <rect x="488" y="30" width="12" height="12" rx="2" fill="#7dd3fc" />
    <rect x="470" y="16" width="14" height="14" rx="2.5" fill="#00c8ff" />
  </g>
